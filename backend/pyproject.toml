[project]
name = "clothing-erp-backend"
version = "0.1.0"
description = "Clothing ERP backend (FastAPI + SQLAlchemy 2.0 async)"
requires-python = ">=3.12"

# ============================================================================
# Ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ASYNC",
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument (FastAPI Depends pattern)
    "S101",  # assert allowed in tests
    # 本项目注释与文档字符串一律用中文，全角标点（），：；是正确写法。
    # RUF001/002/003 是为防同形字符伪装设计的，在中文语境下全是误报（5906 处）。
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    # 异常类名不强制 Error 后缀。现有命名（CredentialNotFound / WecomRateLimited 等）
    # 语义清晰，重命名 13 个类需连带改动全部 raise/except/import/测试引用，
    # 属高风险零收益的纯风格改动。
    "N818",  # error-suffix-on-exception-name
    # 允许 `DesignStatus as DS` 这类短别名。DS 在状态机转换表中被引用约 60 次，
    # 用全名会让转换表显著变宽、可读性下降。
    "N817",  # camelcase-imported-as-acronym
]

[tool.ruff.lint.per-file-ignores]
# 测试与运维脚本里 Session / Maker / AppSession 是 sessionmaker 工厂，
# CapWords 是 SQLAlchemy 官方文档的惯用写法；SENSITIVE_MSG 是测试常量。
"tests/**" = ["S", "N802", "N803", "N806"]
"scripts/**" = ["N806"]
"alembic/**" = ["E402", "F401"]
# 这三个仓储用 f-string 拼接 SQL，但插值部分只有代码控制的片段
# （模块常量、按布尔开关选择的子句），所有用户输入一律走绑定参数（:tenant_id/:kw/...）。
# 多行 f-string 上挂 inline noqa 很脆弱，故按文件豁免。
# 新增拼接逻辑时务必确认：用户可控值只能进 params，不能进 f-string。
"app/modules/promotion/repository.py" = ["S608"]
"app/modules/report/advanced_repository.py" = ["S608"]
"app/modules/report/repository.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/versions/", "tests/"]

# 以下三项从 strict 里关掉。它们约束的是「注解覆盖率」而非类型正确性，
# 存量代码从未满足过，全量补齐是 70 个文件、150+ 处的改动，收益远低于成本。
# 关掉后 mypy 仍然检查真实类型错误：不兼容的赋值 / 参数 / 返回值、未定义名称、
# Optional 误用等；``check_untyped_defs``（strict 默认开启）也仍会检查无注解函数的函数体。
disallow_any_generics = false        # 允许裸 dict / list（原 85 项 type-arg）
disallow_untyped_defs = false        # 不强制每个函数都有注解（原 32 项 no-untyped-def）
disallow_untyped_decorators = false  # celery 无官方 stubs，其装饰器必然是 Any（原 14 项 misc）

[[tool.mypy.overrides]]
# 这些库无类型信息或其 stub 与本项目 pinned 版本不匹配，统一忽略缺失导入。
module = [
    "passlib.*",
    "boto3.*",
    "botocore.*",
    "celery.*",
    "slowapi.*",
    "openpyxl.*",
]
ignore_missing_imports = true

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-ra",
]
markers = [
    "unit: 单元测试",
    "integration: 集成测试（需 PostgreSQL）",
    "api: API 端点测试",
    "rls: RLS 策略测试",
    "tenant: 多租户隔离测试",
    "performance: 性能测试（CI 默认跳过）",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/core/celery_app.py",
    "app/tasks/*",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
