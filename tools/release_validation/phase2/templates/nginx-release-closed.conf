user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 80 default_server;
    server_name 47.110.76.9;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme; default_type text/plain; try_files $uri =404;
    }
    location / { add_header Retry-After 300 always; return 503 "Maintenance\n"; }
  }
  server {
    listen 443 ssl;
    server_name 47.110.76.9;
    ssl_certificate /etc/letsencrypt/live/clothinkai-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clothinkai-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /progress {
      resolver 127.0.0.11 valid=30s ipv6=off;
      resolver_timeout 3s;
      set $progress_backend progress-dashboard:8080;
      proxy_pass http://$progress_backend$request_uri;
      proxy_set_header Host 47.110.76.9;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 3m;
    }
    location ^~ /progress/ {
      resolver 127.0.0.11 valid=30s ipv6=off;
      resolver_timeout 3s;
      set $progress_backend progress-dashboard:8080;
      proxy_pass http://$progress_backend$request_uri;
      proxy_set_header Host 47.110.76.9;
      proxy_set_header X-Forwarded-Proto https;
      client_max_body_size 3m;
    }
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme; default_type text/plain; try_files $uri =404;
    }
    location / { add_header Retry-After 300 always; return 503 "Maintenance\n"; }
  }
}
