user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log off;
  server {
    listen 80 default_server;
    server_name 47.110.76.9;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme; default_type text/plain; try_files $uri =404;
    }
    location / { add_header Retry-After 300 always; return 503 "Maintenance\n"; }
  }
  server {
    listen 443 ssl;
    server_name 47.110.76.9;
    ssl_certificate /etc/letsencrypt/live/clothinkai-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clothinkai-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme; default_type text/plain; try_files $uri =404;
    }
    location / { add_header Retry-After 300 always; return 503 "Maintenance\n"; }
  }
}
