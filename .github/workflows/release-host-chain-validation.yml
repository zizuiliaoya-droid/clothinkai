name: Disposable host chain kernels

on:
  push:
    branches: [codex/release-linux-ci-1023]

permissions:
  contents: read

concurrency:
  group: release-host-chain-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_COMMIT: 55477c44f09bb1a25169bfb44ff6c90bc4f9cedb
  SOURCE_TREE: 28c0cac9a15cc48a5dfa5c7d3ed732cd6a59abdc

jobs:
  global-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: validation, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact frozen bundle
        run: python -B validation/tools/release_validation/verify_bundle.py --expected-tool-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/release-validation"
      - name: Actual cross-candidate flock and durable claims
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_host_global_lock_os.py \
            > "$RUNNER_TEMP/release-validation/result.json" \
            2> "$RUNNER_TEMP/release-validation/output.log"
      - name: Host contracts and exact public dependency pins
        working-directory: validation/tools/release_validation/phase2
        run: |
          set -euo pipefail
          python -B -m unittest tests.test_host_app_open_control tests.test_host_freeze_control \
            tests.test_host_session_contract tests.test_host_migration_control tests.test_host_backup_control \
            tests.test_host_acceptance_private_json tests.test_host_acceptance_control -v \
            > "$RUNNER_TEMP/release-validation/host-contracts.log" 2>&1
          python -B -m unittest discover -s ci_tests -p test_producer_health_policy.py -v > "$RUNNER_TEMP/release-validation/health-policy-contracts.log" 2>&1
          python -B ../test_host_bundle.py -v > "$RUNNER_TEMP/release-validation/bundle-contracts.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-chain-global-lock-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/release-validation/

  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: validation, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 55477c44f09bb1a25169bfb44ff6c90bc4f9cedb
          path: product-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact frozen bundle
        run: python -B validation/tools/release_validation/verify_bundle.py --expected-tool-commit "$GITHUB_SHA" --source "$GITHUB_WORKSPACE/product-source" --output "$RUNNER_TEMP/release-validation"
      - name: Select bounded dependency source for the synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          mirror=https://pypi.tuna.tsinghua.edu.cn/simple
          index="$mirror"
          probe_exit=0
          if probe_http=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 1 --retry-max-time 25 \
            --output /dev/null --write-out '%{http_code}' "$mirror/asyncpg/"); then
            echo "Dependency mirror probe succeeded; using Tsinghua mirror."
          else
            probe_exit=$?
            index=https://pypi.org/simple
            echo "::notice::Mirror unavailable (curl=$probe_exit HTTP=$probe_http); bounded fallback to official PyPI."
          fi
          python - "$mirror" "$index" "$probe_http" "$probe_exit" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {
              "data_kind": "synthetic_dependency_source_selection",
              "primary_index": sys.argv[1],
              "selected_index": sys.argv[2],
              "mirror_probe_http_status": sys.argv[3],
              "mirror_probe_exit_code": int(sys.argv[4]),
              "fallback_due_to_probe_failure": sys.argv[1] != sys.argv[2],
              "fallback_after_dependency_error": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "release-validation/dependency-source.json"
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          PY
          printf 'FIXTURE_PIP_INDEX=%s\n' "$index" >> "$GITHUB_ENV"
      - name: Build synthetic Python fixture and pin actual image IDs
        run: |
          set -euo pipefail
          docker pull python:3.12-slim > "$RUNNER_TEMP/release-validation/fixture-pull.log"
          base=$(docker image inspect --format '{{.Id}}' python:3.12-slim)
          [[ "$base" =~ ^sha256:[0-9a-f]{64}$ ]]
          # FROM accepts image references, not raw image IDs. The docker driver
          # consumes verified local tags; loopback names prevent DockerHub fallback.
          base_tag="localhost:65534/flow78-ci-python:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          health_tag="localhost:65534/flow78-ci-health:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(docker image ls --quiet --filter "reference=$base_tag")"
          test -z "$(docker image ls --quiet --filter "reference=$health_tag")"
          docker image tag "$base" "$base_tag"
          test "$(docker image inspect --format '{{.Id}}' "$base_tag")" = "$base"
          docker build --builder default --pull=false --build-arg "BASE_IMAGE=$base_tag" --build-arg "PIP_INDEX_URL=$FIXTURE_PIP_INDEX" \
            --iidfile "$RUNNER_TEMP/release-validation/health-image-id.txt" \
            -f validation/tools/release_validation/phase2/ci_tests/producer-fixture.Dockerfile \
            validation/tools/release_validation/phase2/ci_tests \
            > "$RUNNER_TEMP/release-validation/fixture-build.log" 2>&1
          image=$(cat "$RUNNER_TEMP/release-validation/health-image-id.txt")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' "$base_tag")" = "$base"
          docker image tag "$image" "$health_tag"
          test "$(docker image inspect --format '{{.Id}}' "$health_tag")" = "$image"
          docker image inspect --format '{{json .}}' "$image" > "$RUNNER_TEMP/release-validation/fixture-image.json"
          docker run --rm --pull=never --network=none --entrypoint python "$image" -m pip freeze \
            > "$RUNNER_TEMP/release-validation/fixture-dependencies.txt"
          mkdir "$RUNNER_TEMP/producer-control-context"
          printf 'FROM %s\nHEALTHCHECK NONE\n' "$health_tag" > "$RUNNER_TEMP/producer-control-context/Dockerfile"
          docker build --builder default --pull=false --network=none --iidfile "$RUNNER_TEMP/release-validation/control-image-id.txt" \
            "$RUNNER_TEMP/producer-control-context" \
            > "$RUNNER_TEMP/release-validation/control-build.log" 2>&1
          control=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          [[ "$control" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker image inspect --format '{{.Id}}' "$base_tag")" = "$base"
          test "$(docker image inspect --format '{{.Id}}' "$health_tag")" = "$image"
          docker image inspect "$base" "$image" "$control" > "$RUNNER_TEMP/release-validation/fixture-build-images.json"
          python - "$base_tag" "$base" "$health_tag" "$image" "$control" <<'PY'
          import json, os, sys
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "release-validation"
          base, health, control = json.loads((output / "fixture-build-images.json").read_bytes())
          assert [base["Id"], health["Id"], control["Id"]] == [sys.argv[2], sys.argv[4], sys.argv[5]]
          base_layers = base["RootFS"]["Layers"]
          assert base_layers and health["RootFS"]["Layers"][:len(base_layers)] == base_layers
          assert control["RootFS"] == health["RootFS"]
          assert health["Config"]["Healthcheck"]["Test"][0] == "CMD-SHELL"
          assert control["Config"]["Healthcheck"]["Test"] == ["NONE"]
          result = {
              "data_kind": "synthetic_local_build_binding",
              "base_tag": sys.argv[1], "base_id": base["Id"],
              "health_tag": sys.argv[3], "health_id": health["Id"], "control_id": control["Id"],
              "local_tag_id_checked_before_and_after": True,
              "base_layers_preserved": True, "control_layers_unchanged": True,
              "builder": "default", "production_image": False,
          }
          (output / "fixture-build-bindings.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Original no-healthcheck kernel as an explicit control case
        run: |
          set -euo pipefail
          export FLOW78_CI_PRODUCER_IMAGE=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          sudo --preserve-env=GITHUB_ACTIONS,FLOW78_CI_PRODUCER_IMAGE "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_host_producer_docker.py \
            > "$RUNNER_TEMP/release-validation/control-result.json" \
            2> "$RUNNER_TEMP/release-validation/control-output.log"
      - name: Actual inherited healthcheck overlap diagnostic (HOLD is not compatibility)
        if: always()
        run: |
          set -euo pipefail
          export FLOW78_CI_PRODUCER_IMAGE=$(cat "$RUNNER_TEMP/release-validation/health-image-id.txt")
          sudo --preserve-env=GITHUB_ACTIONS,FLOW78_CI_PRODUCER_IMAGE "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_producer_healthcheck.py \
            > "$RUNNER_TEMP/release-validation/health-overlap-result.json" \
            2> "$RUNNER_TEMP/release-validation/health-overlap-output.log"
      - name: Actual GNU and dumb DBM stores with the pinned original seven tasks
        if: always()
        run: |
          set -euo pipefail
          image=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker run --rm --pull=never --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges=true --memory=512m --cpus=1 --pids-limit=64 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --env GITHUB_ACTIONS=true \
            --mount "type=bind,src=$GITHUB_WORKSPACE/validation/tools/release_validation,dst=/validation,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/product-source,dst=/product-source,readonly" \
            --entrypoint python "$image" -I -B /validation/phase2/ci_tests/run_dbm_docker.py \
            > "$RUNNER_TEMP/release-validation/dbm-result.json" \
            2> "$RUNNER_TEMP/release-validation/dbm-output.log"
      - name: Actual nginx maintenance routes and old-worker drain
        if: always()
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/product-source/frontend/Dockerfile" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          assert b"FROM nginx:1.27-alpine\n" in raw
          result = {"source_commit": os.environ["SOURCE_COMMIT"], "dockerfile_sha256": hashlib.sha256(raw).hexdigest(), "base_reference": "nginx:1.27-alpine", "production_image_verified": False}
          output = Path(os.environ["RUNNER_TEMP"]) / "release-validation/nginx-source-base.json"
          output.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          docker pull nginx:1.27-alpine > "$RUNNER_TEMP/release-validation/nginx-pull.log" 2>&1
          export FLOW78_CI_NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' nginx:1.27-alpine)
          [[ "$FLOW78_CI_NGINX_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect --format '{"id":{{json .Id}},"repo_digests":{{json .RepoDigests}}}' "$FLOW78_CI_NGINX_IMAGE" > "$RUNNER_TEMP/release-validation/nginx-fixture-image.json"
          export FLOW78_CI_PRODUCER_IMAGE=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          sudo --preserve-env=GITHUB_ACTIONS,FLOW78_CI_PRODUCER_IMAGE,FLOW78_CI_NGINX_IMAGE "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_nginx_docker.py \
            > "$RUNNER_TEMP/release-validation/nginx-result.json" \
            2> "$RUNNER_TEMP/release-validation/nginx-output.log"
      - name: Actual Compose replacement bindings without running application commands
        if: always()
        run: |
          set -euo pipefail
          export FLOW78_CI_OUTPUT="$RUNNER_TEMP/release-validation"
          export FLOW78_CI_CONTROL_IMAGE=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          export FLOW78_CI_PRODUCER_IMAGE=$(cat "$RUNNER_TEMP/release-validation/health-image-id.txt")
          export FLOW78_CI_NGINX_IMAGE=$(docker image inspect --format '{{.Id}}' nginx:1.27-alpine)
          sudo --preserve-env=GITHUB_ACTIONS,FLOW78_CI_CONTROL_IMAGE,FLOW78_CI_PRODUCER_IMAGE,FLOW78_CI_NGINX_IMAGE,FLOW78_CI_OUTPUT "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_compose_docker.py \
            > "$RUNNER_TEMP/release-validation/compose-result.json" \
            2> "$RUNNER_TEMP/release-validation/compose-output.log"
      - name: Actual original Celery registry and isolated Redis scheduling windows
        if: always()
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/product-source/.github/workflows/ci.yml" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          assert b"image: redis:7-alpine" in raw
          result = {"source_commit": os.environ["SOURCE_COMMIT"], "source_ci_sha256": hashlib.sha256(raw).hexdigest(), "reference": "redis:7-alpine", "production_image_verified": False}
          (Path(os.environ["RUNNER_TEMP"]) / "release-validation/redis-source-reference.json").write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          PY
          docker pull redis:7-alpine > "$RUNNER_TEMP/release-validation/redis-pull.log" 2>&1
          export FLOW78_CI_REDIS_IMAGE=$(docker image inspect --format '{{.Id}}' redis:7-alpine)
          [[ "$FLOW78_CI_REDIS_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect --format '{"id":{{json .Id}},"repo_digests":{{json .RepoDigests}}}' "$FLOW78_CI_REDIS_IMAGE" > "$RUNNER_TEMP/release-validation/redis-fixture-image.json"
          export FLOW78_CI_CONTROL_IMAGE=$(cat "$RUNNER_TEMP/release-validation/control-image-id.txt")
          export FLOW78_CI_PRODUCT_SOURCE="$GITHUB_WORKSPACE/product-source"
          export FLOW78_CI_OUTPUT="$RUNNER_TEMP/release-validation"
          sudo --preserve-env=GITHUB_ACTIONS,FLOW78_CI_CONTROL_IMAGE,FLOW78_CI_REDIS_IMAGE,FLOW78_CI_PRODUCT_SOURCE,FLOW78_CI_OUTPUT "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_celery_docker.py \
            > "$RUNNER_TEMP/release-validation/celery-result.json" \
            2> "$RUNNER_TEMP/release-validation/celery-output.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-chain-producer-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/release-validation/

  pg-acceptance-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flow78-disposable-admin-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.sha }}", path: validation, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 55477c44f09bb1a25169bfb44ff6c90bc4f9cedb
          path: product-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify exact frozen bundle and candidate product source
        run: python -B validation/tools/release_validation/verify_bundle.py --expected-tool-commit "$GITHUB_SHA" --source "$GITHUB_WORKSPACE/product-source" --output "$RUNNER_TEMP/release-validation"
      - name: Install exact candidate dependency declarations on disposable runner
        working-directory: product-source/backend
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mirror=https://pypi.tuna.tsinghua.edu.cn/simple
          index="$mirror"
          probe_exit=0
          if probe_http=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 1 --retry-max-time 25 \
            --output /dev/null --write-out '%{http_code}' "$mirror/asyncpg/"); then
            echo "Dependency mirror probe succeeded; using Tsinghua mirror."
          else
            probe_exit=$?
            index=https://pypi.org/simple
            echo "::notice::Mirror unavailable (curl=$probe_exit HTTP=$probe_http); bounded fallback to official PyPI."
          fi
          python - "$mirror" "$index" "$probe_http" "$probe_exit" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {
              "data_kind": "synthetic_dependency_source_selection",
              "primary_index": sys.argv[1],
              "selected_index": sys.argv[2],
              "mirror_probe_http_status": sys.argv[3],
              "mirror_probe_exit_code": int(sys.argv[4]),
              "fallback_due_to_probe_failure": sys.argv[1] != sys.argv[2],
              "fallback_after_dependency_error": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "release-validation/dependency-source.json"
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          PY
          # Installation errors fail this job; they never trigger another index.
          python -m pip --isolated install --disable-pip-version-check \
            --timeout 30 --retries 1 --index-url "$index" -r requirements-dev.txt
      - name: Bind fixture DNS exclusively to loopback
        run: printf '127.0.0.1 prod-db\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Actual PG18.6 5000-row capture, restore, migration, RLS and negative cases
        timeout-minutes: 22
        env:
          PG_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          sudo chown -R root:root "$GITHUB_WORKSPACE/product-source"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP "$(command -v python)" -B \
            validation/tools/release_validation/phase2/ci_tests/run_acceptance_pg.py \
            --repository "$GITHUB_WORKSPACE/product-source" --commit "$SOURCE_COMMIT" --tree "$SOURCE_TREE" \
            --pg-container "$PG_FIXTURE_CONTAINER" --output "$RUNNER_TEMP/release-validation/pg" \
            > "$RUNNER_TEMP/release-validation/pg-result-stdout.json" \
            2> "$RUNNER_TEMP/release-validation/pg-output.log"
      - name: Preserve bounded disposable PostgreSQL errors on failure
        if: failure()
        timeout-minutes: 1
        env:
          PG_FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          [[ "$PG_FIXTURE_CONTAINER" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/release-validation"
          # Diagnostics only: never rerun SQL or hide the earlier failed step.
          timeout 15s docker logs --tail 80 "$PG_FIXTURE_CONTAINER" 2>&1 \
            | head -c 65536 > "$RUNNER_TEMP/release-validation/pg-service-error-tail.log" || true
      - name: Make only synthetic evidence readable for artifact collection
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/release-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-chain-pg-acceptance-restore-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/release-validation/
