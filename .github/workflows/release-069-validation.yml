name: Release 069 targeted validation

on:
  push:
    branches: [codex/release-1007-069-1028]

permissions:
  contents: read

jobs:
  release-067-to-069:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-pg18-admin-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      CI_FLOW7_PG18: "1"
      CI_ADMIN_DATABASE_URL: postgresql://postgres:ci-pg18-admin-only@127.0.0.1:5432/postgres
      DATABASE_URL_APP: postgresql+asyncpg://clothing_app:ci-app-only@127.0.0.1:5432/clothing_erp_test_flow7_pg18
      DATABASE_URL_BYPASS: postgresql+asyncpg://clothing_bypass:ci-bypass-only@127.0.0.1:5432/clothing_erp_test_flow7_pg18
      DATABASE_URL_SYNC: postgresql://clothing_bypass:ci-bypass-only@127.0.0.1:5432/clothing_erp_test_flow7_pg18
      TEST_DATABASE_URL_APP: postgresql+asyncpg://clothing_app:ci-app-only@127.0.0.1:5432/clothing_erp_test_flow7_pg18
      TEST_DATABASE_URL_BYPASS: postgresql+asyncpg://postgres:ci-pg18-admin-only@127.0.0.1:5432/clothing_erp_test_flow7_pg18
      REDIS_URL_CACHE: redis://127.0.0.1:6379/0
      REDIS_URL_CELERY_BROKER: redis://127.0.0.1:6379/1
      REDIS_URL_CELERY_BACKEND: redis://127.0.0.1:6379/2
      JWT_SECRET: ci-test-secret-not-for-production-1234567890abcdef
      CREDENTIAL_MASTER_KEY: Y2lfdGVzdF9wbGFjZWhvbGRlcl9rZXlfMzJfYnl0ZXNfZm9yX3Rlc3Q=
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Candidate integration backend, not a claim that it has been merged.
          ref: cbb1d455ab017850baa52f3ac7ac7ecd1652a771
          path: product-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing hash-locked validation dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.tuna.tsinghua.edu.cn/simple
          -r tools-source/tools/release_validation/phase2/ci_tests/requirements-linux.lock
      - name: Verify the targeted release contracts
        run: python tools-source/tools/release_validation/phase2/ci_tests/test_release_069_contract.py
      - name: Verify actual current 067 to 069 migration and protected data
        working-directory: product-source/backend
        run: python ../../tools-source/tools/release_validation/phase2/ci_tests/run_release_069_pg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-069-validation
          path: product-source/backend/ci-artifacts/
          if-no-files-found: error
          retention-days: 14
