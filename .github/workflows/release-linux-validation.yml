name: Disposable release Linux validation

on:
  push:
    branches: [codex/release-linux-ci-1023]

permissions:
  contents: read

concurrency:
  group: release-linux-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_COMMIT: 55477c44f09bb1a25169bfb44ff6c90bc4f9cedb
  SOURCE_TREE: 28c0cac9a15cc48a5dfa5c7d3ed732cd6a59abdc

jobs:
  linux-os:
    name: Linux pidfd, flock, fsync and no-follow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen tool bytes and record provenance
        run: >-
          python -B validation/tools/release_validation/verify_bundle.py
          --expected-tool-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/release-validation"
      - name: Exercise actual Linux kernel boundaries
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -B validation/tools/release_validation/phase2/ci_tests/run_linux_os.py \
            > "$RUNNER_TEMP/release-validation/result.json" \
            2> "$RUNNER_TEMP/release-validation/output.log"
          cat "$RUNNER_TEMP/release-validation/result.json"
      - name: Retain only synthetic results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-os-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-validation/provenance.json
            ${{ runner.temp }}/release-validation/result.json
            ${{ runner.temp }}/release-validation/output.log

  linux-host-capture:
    name: Linux bounded stdout and child reaping
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen tool bytes and record provenance
        run: >-
          python -B validation/tools/release_validation/verify_bundle.py
          --expected-tool-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/release-validation"
      - name: Exercise actual stdout limit, timeout, cancellation and reaping
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -B validation/tools/release_validation/phase2/ci_tests/run_host_capture_os.py \
            > "$RUNNER_TEMP/release-validation/result.json" \
            2> "$RUNNER_TEMP/release-validation/output.log"
          cat "$RUNNER_TEMP/release-validation/result.json"
      - name: Retain only synthetic results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-host-capture-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-validation/provenance.json
            ${{ runner.temp }}/release-validation/result.json
            ${{ runner.temp }}/release-validation/output.log

  linux-control-kernels:
    name: Linux ${{ matrix.control }} control kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        control: [web, build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact frozen checkpoint bytes
        run: >-
          python -B validation/tools/release_validation/verify_bundle.py
          --expected-tool-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/release-validation"
      - name: Exercise temporary dirfd kernel only
        timeout-minutes: 3
        shell: bash
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 120s \
            python -B "validation/tools/release_validation/phase2/ci_tests/run_${CONTROL}_control_os.py" \
            > "$RUNNER_TEMP/release-validation/result.json" \
            2> "$RUNNER_TEMP/release-validation/output.log"
          cat "$RUNNER_TEMP/release-validation/result.json"
      - name: Retain only kernel results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.control }}-control-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-validation/provenance.json
            ${{ runner.temp }}/release-validation/result.json
            ${{ runner.temp }}/release-validation/output.log

  checkpoint-contracts:
    name: Synthetic host checkpoint and source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact frozen checkpoint bytes
        run: >-
          python -B validation/tools/release_validation/verify_bundle.py
          --expected-tool-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/release-validation"
      - name: Run source fixtures and finite host contracts in separate processes
        timeout-minutes: 5
        working-directory: validation/tools/release_validation/phase2
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python -B -m unittest discover -s ci_tests -p 'test_*.py' -v \
            > "$RUNNER_TEMP/release-validation/source-contracts.log" 2>&1
          timeout --signal=TERM --kill-after=10s 90s \
            python -B -m unittest tests.test_host_policy tests.test_host_journal_connection \
            tests.test_host_finite_operations tests.test_host_build_control \
            tests.test_host_migration_control -v \
            > "$RUNNER_TEMP/release-validation/checkpoint-contracts.log" 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {"mode": "synthetic_checkpoint_contracts", "source_fixture_contracts_passed": True,
                    "host_checkpoint_contracts_passed": True, "production_access": False,
                    "production_29_actions_verified": False, "real_docker_build_verified": False,
                    "real_backup_restore_verified": False, "deployable": False, "live_enabled": False}
          (Path(os.environ["RUNNER_TEMP"]) / "release-validation/result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Retain only synthetic contracts and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checkpoint-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-validation/provenance.json
            ${{ runner.temp }}/release-validation/result.json
            ${{ runner.temp }}/release-validation/source-contracts.log
            ${{ runner.temp }}/release-validation/checkpoint-contracts.log

  postgres:
    name: PG18.6 / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [success, lock_timeout, cancel, advisory_busy]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: flow78-disposable-admin-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - name: Check out the exact product source, independent of CI commit
        uses: actions/checkout@v4
        with:
          ref: 55477c44f09bb1a25169bfb44ff6c90bc4f9cedb
          path: product-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen tools and original source identity
        run: >-
          python -B validation/tools/release_validation/verify_bundle.py
          --expected-tool-commit "$GITHUB_SHA"
          --source "$GITHUB_WORKSPACE/product-source"
          --output "$RUNNER_TEMP/release-validation"
      - name: Install the exact source's pinned dependency declarations
        timeout-minutes: 10
        working-directory: product-source/backend
        shell: bash
        run: |
          set -euo pipefail
          mirror=https://pypi.tuna.tsinghua.edu.cn/simple
          index="$mirror"
          probe_exit=0
          if probe_http=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 15 --retry 1 --retry-max-time 25 \
            --output /dev/null --write-out '%{http_code}' "$mirror/asyncpg/"); then
            echo "Dependency mirror probe succeeded; using Tsinghua mirror."
          else
            probe_exit=$?
            index=https://pypi.org/simple
            echo "::notice::Mirror unavailable (curl=$probe_exit HTTP=$probe_http); bounded fallback to official PyPI."
          fi
          python - "$mirror" "$index" "$probe_http" "$probe_exit" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = {
              "data_kind": "synthetic_dependency_source_selection",
              "primary_index": sys.argv[1],
              "selected_index": sys.argv[2],
              "mirror_probe_http_status": sys.argv[3],
              "mirror_probe_exit_code": int(sys.argv[4]),
              "fallback_due_to_probe_failure": sys.argv[1] != sys.argv[2],
              "fallback_after_dependency_error": False,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "release-validation/dependency-source.json"
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          PY
          # Installation errors fail this job; they never trigger another index.
          python -m pip --isolated install --disable-pip-version-check \
            --timeout 30 --retries 1 --index-url "$index" -r requirements-dev.txt
      - name: Bind the fixture-only hostname to loopback
        shell: bash
        run: |
          set -euo pipefail
          printf '127.0.0.1 prod-db\n' | sudo tee -a /etc/hosts > /dev/null
      - name: Run the original Alembic chain and real scenario
        timeout-minutes: 10
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 540s \
            python -B validation/tools/release_validation/phase2/ci_tests/run_linux.py \
            --repository "$GITHUB_WORKSPACE/product-source" \
            --commit "$SOURCE_COMMIT" --tree "$SOURCE_TREE" --scenario "$SCENARIO" \
            > "$RUNNER_TEMP/release-validation/result.json" \
            2> "$RUNNER_TEMP/release-validation/output.log"
          cat "$RUNNER_TEMP/release-validation/result.json"
      - name: Retain only synthetic results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-pg-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-validation/provenance.json
            ${{ runner.temp }}/release-validation/result.json
            ${{ runner.temp }}/release-validation/output.log
            ${{ runner.temp }}/release-validation/dependency-source.json
